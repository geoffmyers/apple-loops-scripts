<svg xmlns="http://www.w3.org/2000/svg" width="692" height="594" viewBox="0 0 692 594" role="img" aria-label="Terminal output of python3 decode_apple_loops.py --help">
<rect width="692" height="594" rx="10" fill="#12141c"/>
<rect width="692" height="32" rx="10" fill="#1b1e28"/>
<circle cx="20" cy="16" r="6" fill="#ff5f57"/>
<circle cx="38" cy="16" r="6" fill="#febc2e"/>
<circle cx="56" cy="16" r="6" fill="#28c840"/>
<text x="346" y="21" fill="#7f8798" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" text-anchor="middle">apple-loops-scripts</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
<text x="18" y="63.0" fill="#5ac8fa" xml:space="preserve">$ decode_apple_loops.py --help</text>
<text x="18" y="82.0" fill="#d6dae4" xml:space="preserve">usage: decode_apple_loops.py [-h] [--json] [--table] [--detailed]</text>
<text x="18" y="101.0" fill="#d6dae4" xml:space="preserve">                             [--show-markers] [--recursive] [--verify]</text>
<text x="18" y="120.0" fill="#d6dae4" xml:space="preserve">                             [--quiet] [--verbose]</text>
<text x="18" y="139.0" fill="#d6dae4" xml:space="preserve">                             input</text>
<text x="18" y="158.0" fill="#d6dae4" xml:space="preserve"></text>
<text x="18" y="177.0" fill="#d6dae4" xml:space="preserve">Decode and display Apple Loop metadata</text>
<text x="18" y="196.0" fill="#d6dae4" xml:space="preserve"></text>
<text x="18" y="215.0" fill="#d6dae4" xml:space="preserve">positional arguments:</text>
<text x="18" y="234.0" fill="#d6dae4" xml:space="preserve">  input               Input audio file or directory</text>
<text x="18" y="253.0" fill="#d6dae4" xml:space="preserve"></text>
<text x="18" y="272.0" fill="#d6dae4" xml:space="preserve">options:</text>
<text x="18" y="291.0" fill="#d6dae4" xml:space="preserve">  -h, --help          show this help message and exit</text>
<text x="18" y="310.0" fill="#d6dae4" xml:space="preserve">  --json, -j          Output as JSON instead of formatted text</text>
<text x="18" y="329.0" fill="#d6dae4" xml:space="preserve">  --table, -t         Force table output (default for multiple files)</text>
<text x="18" y="348.0" fill="#d6dae4" xml:space="preserve">  --detailed, -d      Force detailed output (default for single file)</text>
<text x="18" y="367.0" fill="#d6dae4" xml:space="preserve">  --show-markers, -m  Show all beat marker positions (detailed mode only)</text>
<text x="18" y="386.0" fill="#d6dae4" xml:space="preserve">  --recursive, -r     Process directories recursively</text>
<text x="18" y="405.0" fill="#d6dae4" xml:space="preserve">  --verify            Check each file against what Logic actually needs (tempo</text>
<text x="18" y="424.0" fill="#d6dae4" xml:space="preserve">                      following, Loop Browser visibility, marker alignment)</text>
<text x="18" y="443.0" fill="#d6dae4" xml:space="preserve">                      and exit non-zero on errors</text>
<text x="18" y="462.0" fill="#d6dae4" xml:space="preserve">  --quiet, -q         Suppress non-error output (useful with --json)</text>
<text x="18" y="481.0" fill="#d6dae4" xml:space="preserve">  --verbose, -v       Show verbose parsing information</text>
<text x="18" y="500.0" fill="#d6dae4" xml:space="preserve"></text>
<text x="18" y="519.0" fill="#d6dae4" xml:space="preserve">Examples:</text>
<text x="18" y="538.0" fill="#d6dae4" xml:space="preserve">  # Decode a single file (detailed output)</text>
<text x="18" y="557.0" fill="#d6dae4" xml:space="preserve">…</text>
</g></svg>
