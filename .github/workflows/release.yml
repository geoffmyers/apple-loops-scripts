# Generated by the development repository's publishing tooling from the
# project's declared release artifacts. Edit them there; a change made only
# here is overwritten by the next publish.
#
# Every push to main builds the artifacts and publishes a release tagged
# v<version>, unless that version is already released: raise the version
# to cut a new one.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Read the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -m1 -o 'MARKETING_VERSION = [^;]*' macos-app/AppleLoopsConverter.xcodeproj/project.pbxproj | cut -d' ' -f3)"
          [ -n "$version" ] || { echo "no version found"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; raise the version to release again."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build-macos-app:
    name: macOS app
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: apple-loops-scripts
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          xcodebuild -project macos-app/AppleLoopsConverter.xcodeproj -target AppleLoopsConverter \
            -configuration Release SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
          codesign --verify --verbose build/Release/AppleLoopsConverter.app
          ditto -c -k --keepParent build/Release/AppleLoopsConverter.app "$NAME-$VERSION-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: build-macos-app
          path: "*.zip"
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, build-macos-app]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        run: |
          cat > notes.md <<'NOTES'
          **macOS app:** download `apple-loops-scripts-{version}-macos.zip`, unzip it and move AppleLoopsConverter.app to Applications. The app is ad-hoc signed, not notarized, so macOS blocks it the first time: right-click it and choose **Open**, or run `xattr -dr com.apple.quarantine "/Applications/AppleLoopsConverter.app"`. The app runs the converter scripts from a clone of this repository; set their path in its Settings.

          The command-line tools need no build: see the [README](https://github.com/geoffmyers/apple-loops-scripts#installation).
          NOTES
          sed -i "s/{version}/$VERSION/g" notes.md
          ls -l assets
          gh release create "v$VERSION" assets/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md --generate-notes
