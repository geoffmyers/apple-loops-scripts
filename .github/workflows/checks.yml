# Generated by the development repository's publishing tooling from the
# project's declared checks, which also gate every publish. Edit the checks
# there; a change made only here is overwritten by the next publish.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - name: tests
        run: |
          python -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt -r requirements-dev.txt
          python -m pytest -q
  macos-app-build:
    name: macOS app build
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - name: macOS app build
        run: |
          xcodebuild -project macos-app/AppleLoopsConverter.xcodeproj -target AppleLoopsConverter \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
